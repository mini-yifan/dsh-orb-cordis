# Source overlay for experimental Computer Use. Tool rows load TypeScript
# through the CLI tsx loader. Not part of dsh-base.

- insert:
    - id: preset-computer-use
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: computer-use
        order: 20
        plugins:
          - id: tool-computer-use
            name: './src/index.ts'
            config:
              postActionWaitMs: 600
              # Bounded screenshot history: the model sees at most `imageWindow` Computer Use
              # screenshots (older ones leave the request as placeholder text), and one assistant
              # step keeps only its last image-bearing GUI result.
              imageWindow: 25
              keepLastStepScreenshot: true
          - id: tool-code-agent
            name: './src/code-agent.ts'

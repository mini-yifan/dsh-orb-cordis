# Computer Use preset and the floating-ball host.
# GUI tools stay on this preset. Do not also insert an agent-presets path.

- insert:
    - id: preset-computer-use
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: computer-use
        name: Computer Use 模式
        description: 精简工具集：Shell、网页检索与抓取、桌面 GUI 操作、向用户提问。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # No `suffix`: the agent loop registers only `provider` and `model`, and
              # `dsh-working-directory` already supplies the current directory as
              # required runtime context. A `{{cwd}}` reference fails prompt assembly.
              prefix: >-
                You are a desktop GUI agent powered by the {{model}} model.
                You operate the screen and decide each stretch yourself.
                When a request needs tools, first write one short sentence of normal reply text in the user's language saying what you will do, then make the first tool call in that same response.
                That sentence is ordinary reply text, not reasoning. Never start that work with tools alone, and never stop after the sentence.
                On a long task, add one short factual update only at a meaningful milestone, then keep working. When the work is done, close with the result; do not recap every step.
                Do one or two visible steps the user is watching, and a search or command that will answer or feed the next click, in this chat.
                A second search that you expect will hit the point stays here.
                When you are still digging through files, searches, or commands, when the user asked for a file, document, spreadsheet, or site, or when the work needs many clicks in one app the user is not using, send that stretch to code_agent: the background desktop agent works it silently.
                Omit cwd so the tool mints a subdirectory, unless the user named a path or this folder.
                If the user said this folder and Finder is not frontmost, ask instead of calling code_agent.
                After code_agent accepts, tell the user the background agent is running.
                Continue a GUI action in this turn only when it does not need that result; otherwise end the turn.
                Call code_agent_status or code_agent_stop when the user asks about or stops background work.
                When a plugin notice reports that work finished, decide again: do remaining GUI, or call code_agent with that session_id for another stretch, then tell the user the short conclusion.
                If the notice says the user stopped that background session, tell the user briefly and do not call code_agent for it again unless the user asks.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-computer-use
            name: 'dsh-orb/computer-use'
            config:
              postActionWaitMs: 600
          - id: tool-code-agent
            name: 'dsh-orb/computer-use/code-agent'
    - id: orb-code-agent-registry
      name: 'dsh-orb/computer-use/code-agent-registry'
    # Lasso capture and the lasso first-frame slot are read by the orb host and the
    # Computer Use preset, so both must be published on this app-level row: a preset's
    # provide is realm-private and the mount audit rejects it.
    - id: orb-lasso
      name: 'dsh-orb/computer-use/lasso-service'
    - id: orb-host
      name: 'dsh-orb/host'
      config:
        autoStart: true
    - id: ui-settings-orb
      name: dsh-orb

# The background desktop preset: the standard tool set, minus everything that needs a
# human in the loop, plus silent desktop operation.
#
# Rows deliberately absent from `standard`:
# - plan mode: an unattended worker cannot ask for plan approval;
# - delegation: subagents would multiply the hands on one screen;
# - ask_user_question: the background agent reports back instead of asking;
# - present: it has no window to present into.
- insert:
    - id: preset-desktop
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: desktop
        name: 后台桌面模式
        description: 标准能力 + 静默操作桌面软件。不动鼠标、不抢焦点；需要时借用前台几秒；不能向用户提问。
        order: 21
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a background desktop worker powered by the {{model}} model.
                You do not talk to the user and you cannot ask questions.
                You work through files, commands, and the desktop tools.
                You see an application as a text tree of roles, names, values, and refs; you never see pixels, layout, or color.
                Desktop actions are silent by default: no mouse movement and no focus change.
                Snapshot before acting, and snapshot again after anything changes.
                Never operate the application the user is working in: find another way, or stop and report.
                Borrow the foreground only when silent control was refused, and only while the user is idle; give it back as soon as that step is done.
                When you are blocked, stop and hand back what you did, where you stopped, why the user is needed, the options, and the risk.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # 0.2.x requires this value; 0.1.7 accepts it. Omitting it breaks the
          # whole preset on current releases.
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-desktop
            name: 'dsh-orb/desktop'

# Temporary comparison mode: the standard toolset plus the upstream CLI on PATH.
# Nothing here is wrapped by the orb — no ribbon, no guard, no ref book, no policy
# escalation. It exists to answer one question: is raw agent-desktop good enough?
- insert:
    - id: preset-desktop-raw
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: desktop-raw
        name: 桌面测试（原始 agent-desktop）
        description: 标准能力 + 未经包装的 agent-desktop 命令行。没有彩带、没有护栏，用来对比原生效果。
        order: 22
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a coding agent powered by the {{model}} model with direct access to this Mac through the unmodified
                agent-desktop command-line tool, which is on PATH.
                Before the first desktop action, run `agent-desktop status`, then `agent-desktop skills get desktop` and
                `agent-desktop skills get platform`, and follow those guides exactly.
                Nothing is wrapped: snapshots, refs and actions are the upstream tool's own.
                Physical input is available; when a control has no semantic action, decide deliberately whether to use
                --headed, and confirm the result by reading the screen again.
                Never repeat a submit to "make sure": read the result first.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-desktop-cli
            name: 'dsh-orb/desktop/cli-path'

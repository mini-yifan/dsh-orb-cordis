<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self';">
    <title></title>
    <link rel="stylesheet" href="agent-frame.css">
  </head>
  <body>
    <svg id="ribbon" aria-hidden="true">
      <defs>
        <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFC24B" />
          <stop offset="0.52" stop-color="#FF8F5A" />
          <stop offset="1" stop-color="#FF6FA5" />
        </linearGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="5" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>
      <rect id="ring" rx="16" ry="16" />
    </svg>
    <div id="chip">
      <span id="dot"></span>
      <span id="label"></span>
    </div>
  </body>
</html>
